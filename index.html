<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SchoolLink RDC</title><style>body{font-family:system-ui;margin:0;background:#f5f7fb;color:#172033}.top{background:#102a43;color:white;padding:18px 24px}.wrap{max-width:1100px;margin:30px auto;padding:0 18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px}.card{background:white;border-radius:12px;padding:20px;box-shadow:0 2px 10px #0001}.muted{color:#667085}button{background:#1261a0;color:white;border:0;border-radius:8px;padding:10px 14px;cursor:pointer}input{padding:10px;border:1px solid #ddd;border-radius:8px;width:100%;box-sizing:border-box;margin:6px 0 12px}table{width:100%;border-collapse:collapse;background:white}td,th{padding:12px;border-bottom:1px solid #eee;text-align:left}.panel{background:white;padding:20px;border-radius:12px;margin-top:18px}</style></head><body><div class="top"><b>SchoolLink RDC</b><span class="muted" style="color:#cbd5e1"> — administration scolaire</span></div><div class="wrap"><div id="login" class="panel"><h2>Connexion</h2><input id="email" value="admin@schoollink.cd"><input id="password" type="password" value="ChangeMe123!"><button onclick="login()">Se connecter</button><p id="err"></p></div><div id="app" style="display:none"><h2>Tableau de bord</h2><div class="grid"><div class="card"><span class="muted">Élèves</span><h2 id="count">—</h2></div><div class="card"><span class="muted">API</span><h2>Connectée</h2></div><div class="card"><span class="muted">École</span><h2 id="school">—</h2></div></div><div class="panel"><h3>Élèves</h3><table><thead><tr><th>Matricule</th><th>Nom</th><th>Classe</th></tr></thead><tbody id="students"></tbody></table></div></div></div><script>let token='';async function login(){const r=await fetch((localStorage.api||'http://localhost:4000')+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const d=await r.json();if(!r.ok){err.textContent=d.error;return}token=d.token;localStorage.token=token;loginBox();load()}function loginBox(){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block'}async function load(){const base=localStorage.api||'http://localhost:4000';const r=await fetch(base+'/students',{headers:{Authorization:'Bearer '+token}});const s=await r.json();count.textContent=s.length;students.innerHTML=s.map(x=>`<tr><td>${x.matricule}</td><td>${x.name}</td><td>${x.class?.name||'—'}</td></tr>`).join('');const me=await fetch(base+'/me',{headers:{Authorization:'Bearer '+token}}).then(x=>x.json());school.textContent=me.school?.name||'—'}if(localStorage.token){token=localStorage.token;loginBox();load()}</script></body></html>
